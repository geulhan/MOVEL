<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" fill="none">
  <title>MotionHub Master - Adobe Illustrator import</title>
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="60" y="50" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0F172A">MotionHub Brand Master</text>
  <text x="60" y="78" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Import to Adobe Illustrator ù Edit layers ù Export .ai</text>

  <!-- Symbol Dark -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Symbol  Dark (#2EE8D6)</text>
    <rect x="0" y="16" width="120" height="120" rx="12" fill="#0F172A"/>
    <g transform="translate(28, 44) scale(1)">
      <circle cx="32" cy="32" r="6" fill="#2EE8D6"/>
      <line x1="32" y1="26" x2="32" y2="12" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="38" x2="32" y2="52" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="32" x2="12" y2="32" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="32" x2="52" y2="32" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="10" r="4" fill="#2EE8D6"/>
      <circle cx="32" cy="54" r="4" fill="#2EE8D6"/>
      <circle cx="10" cy="32" r="4" fill="#2EE8D6"/>
      <circle cx="54" cy="32" r="4" fill="#2EE8D6"/>
    </g>
  </g>

  <!-- Symbol Light -->
  <g transform="translate(220, 120)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Symbol  Light (#0F172A)</text>
    <rect x="0" y="16" width="120" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <g transform="translate(28, 44)">
      <circle cx="32" cy="32" r="6" fill="#0F172A"/>
      <line x1="32" y1="26" x2="32" y2="12" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="38" x2="32" y2="52" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="32" x2="12" y2="32" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="32" x2="52" y2="32" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="10" r="4" fill="#0F172A"/>
      <circle cx="32" cy="54" r="4" fill="#0F172A"/>
      <circle cx="10" cy="32" r="4" fill="#0F172A"/>
      <circle cx="54" cy="32" r="4" fill="#0F172A"/>
    </g>
  </g>

  <!-- Wordmark Dark -->
  <g transform="translate(60, 300)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Wordmark  Dark</text>
    <rect x="0" y="16" width="520" height="80" rx="12" fill="#0F172A"/>
    <text x="20" y="68" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">
      <tspan fill="#F8FAFC">Motion</tspan><tspan fill="#2EE8D6">Hub</tspan>
    </text>
  </g>

  <!-- Wordmark Light -->
  <g transform="translate(60, 420)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Wordmark  Light</text>
    <rect x="0" y="16" width="520" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="68" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">
      <tspan fill="#0F172A">Motion</tspan><tspan fill="#14B8A6">Hub</tspan>
    </text>
  </g>

  <!-- Combination Dark -->
  <g transform="translate(60, 540)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Combination  Dark</text>
    <rect x="0" y="16" width="640" height="96" rx="12" fill="#0F172A"/>
    <g transform="translate(20, 32) scale(0.9)">
      <circle cx="32" cy="32" r="6" fill="#2EE8D6"/>
      <line x1="32" y1="26" x2="32" y2="12" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="38" x2="32" y2="52" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="32" x2="12" y2="32" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <line x1="38" y1="32" x2="52" y2="32" stroke="#2EE8D6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="10" r="4" fill="#2EE8D6"/>
      <circle cx="32" cy="54" r="4" fill="#2EE8D6"/>
      <circle cx="10" cy="32" r="4" fill="#2EE8D6"/>
      <circle cx="54" cy="32" r="4" fill="#2EE8D6"/>
    </g>
    <text x="100" y="72" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.8">
      <tspan fill="#F8FAFC">Motion</tspan><tspan fill="#2EE8D6">Hub</tspan>
    </text>
  </g>

  <!-- App Icon -->
  <g transform="translate(760, 120)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">App Icon 1024</text>
    <rect x="0" y="16" width="200" height="200" rx="44" fill="#0F172A"/>
    <g transform="translate(100, 116)">
      <circle cx="0" cy="0" r="14" fill="#2EE8D6"/>
      <line x1="0" y1="-14" x2="0" y2="-40" stroke="#2EE8D6" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="0" y2="40" stroke="#2EE8D6" stroke-width="7" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="-40" y2="0" stroke="#2EE8D6" stroke-width="7" stroke-linecap="round"/>
      <line x1="14" y1="0" x2="40" y2="0" stroke="#2EE8D6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="-44" r="9" fill="#2EE8D6"/>
      <circle cx="0" cy="44" r="9" fill="#2EE8D6"/>
      <circle cx="-44" cy="0" r="9" fill="#2EE8D6"/>
      <circle cx="44" cy="0" r="9" fill="#2EE8D6"/>
    </g>
  </g>

  <!-- Color swatches -->
  <g transform="translate(760, 380)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Brand Colors</text>
    <rect x="0" y="20" width="80" height="80" rx="8" fill="#2EE8D6"/>
    <text x="0" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0F172A">#2EE8D6 Primary</text>
    <rect x="120" y="20" width="80" height="80" rx="8" fill="#0F172A"/>
    <text x="120" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0F172A">#0F172A Dark</text>
  </g>
</svg>
